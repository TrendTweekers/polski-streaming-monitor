name: svc-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bot
        run: |
          pip install -r bot/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Open WP Pilot and Polsat Box Go without a VPN, then through NordVPN in Poland
        env:
          NORD_PL_WG: ${{ secrets.NORD_PL_WG }}
        run: |
          xvfb-run -a python bot/svc_probe.py abroad
          xvfb-run -a python bot/svc_probe.py vpn --vpn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svc
          path: out/svc
          retention-days: 7
