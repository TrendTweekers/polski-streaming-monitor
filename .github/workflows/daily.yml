name: daily-test
on:
  schedule:
    # GitHub often starts timed jobs hours late or not at all. Several tries;
    # the gate job stops a try when today's result is already published.
    - cron: "17 3 * * *"
    - cron: "47 4 * * *"
    - cron: "23 6 * * *"
    - cron: "53 7 * * *"
    - cron: "37 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-test
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        run: |
          last=$(python -c "import json;print(json.load(open('site/data/latest.json'))['date'])")
          today=$(TZ=Europe/Warsaw date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$last" = "$today" ]; then echo "run=no" >> "$GITHUB_OUTPUT"; echo "already done today"; else echo "run=yes" >> "$GITHUB_OUTPUT"; fi
  test:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bot
        run: |
          pip install -r bot/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run tests
        env:
          PROTON_PL_WG: ${{ secrets.PROTON_PL_WG }}
          PROTON_PLUS_PL_WG: ${{ secrets.PROTON_PLUS_PL_WG }}
          NORD_PL_WG: ${{ secrets.NORD_PL_WG }}
          SURFSHARK_PL_WG: ${{ secrets.SURFSHARK_PL_WG }}
          EXPRESS_PL_WG: ${{ secrets.EXPRESS_PL_WG }}
          CYBERGHOST_PL_WG: ${{ secrets.CYBERGHOST_PL_WG }}
          PIA_USER: ${{ secrets.PIA_USER }}
          PIA_PASS: ${{ secrets.PIA_PASS }}
        run: xvfb-run -a python bot/bot.py
      - name: Rebuild pages with the new results
        run: python sitegen/build.py
      - name: Publish results
        run: |
          # Vercel only deploys commits from the repo owner, so the bot commits as the owner.
          git config user.name "TrendTweekers"
          git config user.email "224116307+TrendTweekers@users.noreply.github.com"
          git add site
          git diff --cached --quiet || git commit -m "Test results $(date -u +%F)"
          # If the repo changed during the test, put the bot results on top. The bot data wins.
          git pull --rebase -X theirs origin main
          git push
      - name: Tell the owner the result
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then python bot/notify.py; elif [ "$JOB_STATUS" = "cancelled" ]; then python bot/notify.py "⏱️ <b>Polski Streaming</b>: the daily test was stopped (time limit or a newer run). The next try runs later today."; else python bot/notify.py "🚨 <b>Polski Streaming</b>: the daily test FAILED (status: $JOB_STATUS). Check GitHub Actions."; fi
