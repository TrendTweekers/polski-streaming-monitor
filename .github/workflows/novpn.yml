name: novpn-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bot
        run: |
          pip install -r bot/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Open the test videos without a VPN
        run: xvfb-run -a python bot/novpn_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: novpn
          path: out/novpn
          retention-days: 7
